name: Deploy
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Setup Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build
      env:
        ZENDESK_SUBDOMAIN: ${{ secrets.ZENDESK_SUBDOMAIN }}
        ZENDESK_OAUTH_CLIENT_ID: ${{ secrets.ZENDESK_OAUTH_CLIENT_ID }}
        ZENDESK_OAUTH_CLIENT_SECRET: ${{ secrets.ZENDESK_OAUTH_CLIENT_SECRET }}
        SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        AUTH_URL: ${{ secrets.AUTH_URL }}

    - name: Deploy notification
      run: echo "Deployment completed successfully"
      
    # Add your deployment steps here based on your hosting provider
    # Examples:
    # - Vercel: Use vercel/actions
    # - AWS: Use aws-actions/configure-aws-credentials
    # - Docker: Build and push to registry
