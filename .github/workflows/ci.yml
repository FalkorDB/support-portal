name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Run TypeScript type check
      run: npx tsc --noEmit

    - name: Build project
      run: npm run build
      env:
        # Use dummy values for build-time environment variables
        ZENDESK_SUBDOMAIN: ci-test
        ZENDESK_OAUTH_CLIENT_ID: dummy-oauth-client-id
        ZENDESK_OAUTH_CLIENT_SECRET: dummy-oauth-client-secret
        SESSION_SECRET: ci-test-secret-key
        AUTH_SECRET: ci-test-auth-secret
        AUTH_URL: http://localhost:3000

    - name: Check build output
      run: |
        if [ ! -d ".next" ]; then
          echo "Build failed - .next directory not found"
          exit 1
        fi
        echo "Build successful"
